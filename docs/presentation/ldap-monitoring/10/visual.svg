  <path d="M842 436 H780 V490 H745" fill="none" stroke="#a06c1a" stroke-width="3" stroke-dasharray="8 8" stroke-linecap="round" marker-end="url(#amberArrow)"/>
  <g font-family="Segoe UI, Arial" font-size="14" font-weight="700" text-anchor="middle" fill="#556474">
    <text x="397" y="525">handoff</text>
    <text x="785" y="312">returns base bag</text>
    <text x="786" y="474" fill="#7c5517">SharpHound helper type</text>
