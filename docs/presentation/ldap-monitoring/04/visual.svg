<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#f9f8f4"/>
  <text x="70" y="84" font-family="Segoe UI, Arial" font-size="40" font-weight="700" fill="#20242d">Method A: dump and diff</text>
  <line x1="145" y1="310" x2="1135" y2="310" stroke="#2d3748" stroke-width="4"/>
  <g font-family="Segoe UI, Arial" fill="#20242d">
    <circle cx="220" cy="310" r="38" fill="#d9e8ff" stroke="#2f67a2" stroke-width="3"/><text x="220" y="318" text-anchor="middle" font-size="20" font-weight="700">T0</text>
    <circle cx="520" cy="310" r="38" fill="#d9e8ff" stroke="#2f67a2" stroke-width="3"/><text x="520" y="318" text-anchor="middle" font-size="20" font-weight="700">T1</text>
    <circle cx="820" cy="310" r="38" fill="#d9e8ff" stroke="#2f67a2" stroke-width="3"/><text x="820" y="318" text-anchor="middle" font-size="20" font-weight="700">T2</text>
    <rect x="165" y="385" width="210" height="78" rx="10" fill="#ffffff" stroke="#95a0ad"/><text x="270" y="430" text-anchor="middle" font-size="22">Full LDAP dump</text>
    <rect x="455" y="385" width="210" height="78" rx="10" fill="#ffffff" stroke="#95a0ad"/><text x="560" y="430" text-anchor="middle" font-size="22">Full LDAP dump</text>
    <rect x="745" y="385" width="210" height="78" rx="10" fill="#ffffff" stroke="#95a0ad"/><text x="850" y="430" text-anchor="middle" font-size="22">Full LDAP dump</text>
    <rect x="975" y="228" width="210" height="164" rx="12" fill="#fde6df" stroke="#c95844" stroke-width="2"/>
    <text x="1080" y="278" text-anchor="middle" font-size="24" font-weight="700">Diff output</text><text x="1080" y="316" text-anchor="middle" font-size="20">latency and load</text><text x="1080" y="350" text-anchor="middle" font-size="20">scale with interval</text>
  </g>
  <path d="M375 424 H455" stroke="#95a0ad" stroke-width="3" marker-end="url(#arrow)"/><path d="M665 424 H745" stroke="#95a0ad" stroke-width="3" marker-end="url(#arrow)"/><path d="M955 424 C1010 424 1035 400 1060 392" stroke="#95a0ad" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="90" y="605" font-family="Segoe UI, Arial" font-size="24" font-weight="700" fill="#20242d">Good: simple and replayable.</text>
  <text x="90" y="640" font-family="Segoe UI, Arial" font-size="24" fill="#20242d">Cost: delayed signal, noisy diffs, repeated DC reads, stored sensitive snapshots.</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#95a0ad"/></marker></defs>
</svg>
