<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#fbfbf7"/>
  <text x="70" y="84" font-family="Segoe UI, Arial" font-size="40" font-weight="700" fill="#1d2633">High-value LDAP changes</text>
  <text x="72" y="122" font-family="Segoe UI, Arial" font-size="20" fill="#56606c">Small directory edits can alter privilege, persistence, and authentication paths.</text>
  <g font-family="Segoe UI, Arial" font-size="21" fill="#1d2633">
    <rect x="90" y="180" width="320" height="125" rx="10" fill="#e7f0ff" stroke="#2c5e9e" stroke-width="2"/>
    <text x="120" y="222" font-weight="700">Privileged membership</text><text x="120" y="258">Domain Admins, Tier 0 groups</text>
    <rect x="480" y="180" width="320" height="125" rx="10" fill="#fff1d6" stroke="#cc7c1e" stroke-width="2"/>
    <text x="510" y="222" font-weight="700">Delegation and SPNs</text><text x="510" y="258">Kerberos exposure and paths</text>
    <rect x="870" y="180" width="320" height="125" rx="10" fill="#f3e8ff" stroke="#7651a6" stroke-width="2"/>
    <text x="900" y="222" font-weight="700">ACL and ownership</text><text x="900" y="258">WriteDACL, owner, inheritance</text>
    <rect x="90" y="365" width="320" height="125" rx="10" fill="#e6f6e6" stroke="#4e8d4f" stroke-width="2"/>
    <text x="120" y="407" font-weight="700">Certificates</text><text x="120" y="443">ESC paths, templates, CA links</text>
    <rect x="480" y="365" width="320" height="125" rx="10" fill="#fde3e1" stroke="#bd4d49" stroke-width="2"/>
    <text x="510" y="407" font-weight="700">Account controls</text><text x="510" y="443">UAC, pwdLastSet, lockout policy</text>
    <rect x="870" y="365" width="320" height="125" rx="10" fill="#e1f3f4" stroke="#29818c" stroke-width="2"/>
    <text x="900" y="407" font-weight="700">Trusts and GPO objects</text><text x="900" y="443">Boundary and policy drift</text>
  </g>
  <path d="M145 575 H1135" stroke="#1d2633" stroke-width="3"/>
  <circle cx="280" cy="575" r="12" fill="#2c5e9e"/><circle cx="530" cy="575" r="12" fill="#cc7c1e"/><circle cx="780" cy="575" r="12" fill="#bd4d49"/><circle cx="1030" cy="575" r="12" fill="#29818c"/>
  <text x="640" y="635" text-anchor="middle" font-family="Segoe UI, Arial" font-size="28" font-weight="700" fill="#1d2633">The directory is quiet until it is decisive.</text>
</svg>
