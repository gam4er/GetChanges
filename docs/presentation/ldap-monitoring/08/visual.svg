<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#f8fafb"/>
  <text x="70" y="84" font-family="Segoe UI, Arial" font-size="40" font-weight="700" fill="#1a2430">GetChanges PoC architecture</text>
  <g font-family="Segoe UI, Arial" fill="#1a2430" font-size="20">
    <rect x="70" y="250" width="180" height="95" rx="10" fill="#e6efff" stroke="#3267a5" stroke-width="2"/><text x="160" y="290" text-anchor="middle" font-weight="700">Connection</text><text x="160" y="320" text-anchor="middle">Factory</text>
    <rect x="300" y="250" width="180" height="95" rx="10" fill="#fff2d8" stroke="#cf8626" stroke-width="2"/><text x="390" y="290" text-anchor="middle" font-weight="700">Baseline</text><text x="390" y="320" text-anchor="middle">Snapshot</text>
    <rect x="530" y="250" width="180" height="95" rx="10" fill="#e8f5e8" stroke="#448c50" stroke-width="2"/><text x="620" y="290" text-anchor="middle" font-weight="700">Notification</text><text x="620" y="320" text-anchor="middle">Loop</text>
    <rect x="760" y="250" width="180" height="95" rx="10" fill="#f0e8fb" stroke="#7354a8" stroke-width="2"/><text x="850" y="290" text-anchor="middle" font-weight="700">Change</text><text x="850" y="320" text-anchor="middle">Pipeline</text>
    <rect x="990" y="250" width="180" height="95" rx="10" fill="#fde5e1" stroke="#bd5146" stroke-width="2"/><text x="1080" y="290" text-anchor="middle" font-weight="700">Event</text><text x="1080" y="320" text-anchor="middle">Writer</text>
  </g>
  <g stroke="#6d7785" stroke-width="4" marker-end="url(#arrow)">
    <path d="M250 298 H300"/><path d="M480 298 H530"/><path d="M710 298 H760"/><path d="M940 298 H990"/>
  </g>
  <rect x="550" y="430" width="140" height="55" rx="28" fill="#dce7f2" stroke="#6d7785"/><text x="620" y="464" text-anchor="middle" font-family="Segoe UI, Arial" font-size="18" fill="#1a2430">incoming</text>
  <rect x="780" y="430" width="140" height="55" rx="28" fill="#dce7f2" stroke="#6d7785"/><text x="850" y="464" text-anchor="middle" font-family="Segoe UI, Arial" font-size="18" fill="#1a2430">outgoing</text>
  <path d="M620 345 V430" stroke="#6d7785" stroke-width="3" marker-end="url(#arrow)"/><path d="M850 345 V430" stroke="#6d7785" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="640" y="575" text-anchor="middle" font-family="Segoe UI, Arial" font-size="24" font-weight="700" fill="#1a2430">Callbacks stay light. Diffing and disk I/O happen off the LDAP callback path.</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#6d7785"/></marker></defs>
</svg>
