<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#f6f8fb"/>
  <text x="70" y="86" font-family="Segoe UI, Arial" font-size="42" font-weight="700" fill="#172033">LDAP is the AD control plane</text>
  <text x="72" y="126" font-family="Segoe UI, Arial" font-size="20" fill="#526071">Identity changes become security facts when they are observed as events.</text>
  <circle cx="640" cy="360" r="120" fill="#244c7a"/>
  <circle cx="640" cy="360" r="86" fill="#2f7ea3"/>
  <text x="640" y="345" text-anchor="middle" font-family="Segoe UI, Arial" font-size="30" font-weight="700" fill="#ffffff">AD DS</text>
  <text x="640" y="380" text-anchor="middle" font-family="Segoe UI, Arial" font-size="24" fill="#e6f4ff">LDAP</text>
  <g font-family="Segoe UI, Arial" font-size="21" font-weight="600" fill="#172033">
    <rect x="170" y="230" width="190" height="64" rx="10" fill="#d7ecf2" stroke="#2f7ea3"/>
    <text x="265" y="270" text-anchor="middle">Groups</text>
    <rect x="180" y="430" width="190" height="64" rx="10" fill="#fde8c8" stroke="#d18a22"/>
    <text x="275" y="470" text-anchor="middle">ACLs</text>
    <rect x="910" y="225" width="190" height="64" rx="10" fill="#e7e1f4" stroke="#7357a3"/>
    <text x="1005" y="265" text-anchor="middle">GPOs</text>
    <rect x="920" y="430" width="190" height="64" rx="10" fill="#dff0d9" stroke="#4d8f51"/>
    <text x="1015" y="470" text-anchor="middle">Certificates</text>
    <rect x="545" y="585" width="190" height="64" rx="10" fill="#f6d6d6" stroke="#b64f4f"/>
