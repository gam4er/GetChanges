  </g>
  <g stroke="#7d8795" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M360 262 C435 265 500 300 535 325"/>
    <path d="M370 462 C450 452 505 420 535 392"/>
    <path d="M910 258 C830 262 780 300 745 325"/>
    <path d="M920 462 C830 455 780 420 745 392"/>
    <path d="M640 585 L640 485"/>
    <path d="M640 240 L640 168 L1020 168"/>
  </g>
  <rect x="1020" y="132" width="190" height="72" rx="12" fill="#203040"/>
  <text x="1115" y="162" text-anchor="middle" font-family="Segoe UI, Arial" font-size="19" font-weight="700" fill="#ffffff">Observable</text>
  <text x="1115" y="188" text-anchor="middle" font-family="Segoe UI, Arial" font-size="19" fill="#ffffff">change events</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#7d8795"/></marker></defs>
